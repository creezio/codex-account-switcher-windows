name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build portable app
        shell: powershell
        run: ./scripts/build-desktop.ps1 -Portable -OutputDirectory outputs/v0.7.0
      - name: Run offline safety and storage tests
        shell: powershell
        run: ./scripts/test.ps1
      - name: Verify detached worker lifecycle
        shell: powershell
        run: ./scripts/worker-smoke.ps1 -BinaryDirectory outputs/v0.7.0
      - name: Verify modern runtime core
        shell: powershell
        run: dotnet run --project tests/Core.Net10.csproj -c Release -- work/net10-validation
      - name: Test WPF interactions, renders and cross-runtime data
        shell: powershell
        run: ./scripts/test-desktop.ps1 -BinaryDirectory outputs/v0.7.0
      - name: Package
        shell: powershell
        run: ./scripts/package-desktop.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: codex-account-switcher-windows
          path: |
            outputs/*.zip
            outputs/SHA256SUMS-*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-validation
          path: |
            work/desktop-validation/*.png
            work/desktop-validation/results.txt
            work/desktop-validation/data/compatibility-ok.txt
