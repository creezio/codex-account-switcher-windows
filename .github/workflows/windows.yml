name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable app
        shell: powershell
        run: ./scripts/build.ps1
      - name: Run offline safety and storage tests
        shell: powershell
        run: ./scripts/test.ps1
      - name: Verify detached worker lifecycle
        shell: powershell
        run: ./scripts/worker-smoke.ps1
      - name: Render product screens with fixture data
        shell: powershell
        run: ./scripts/visual-smoke.ps1
      - name: Package
        shell: powershell
        run: ./scripts/package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: codex-account-switcher-windows
          path: outputs/*
